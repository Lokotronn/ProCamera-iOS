name: Build iOS ProCamera IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA on macOS
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          echo "Disponibilidad de Xcode:"
          sudo xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project from Spec
        run: |
          xcodegen generate

      - name: Build & Archive (Clean Architecture)
        run: |
          xcodebuild clean archive \
            -project ProCamera.xcodeproj \
            -scheme ProCamera \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ProCamera.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ProCamera.xcarchive/Products/Applications/ProCamera.app build/Payload/
          cd build
          zip -r9 ProCamera.ipa Payload
          cd ..
          ls -lh build/ProCamera.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProCamera-Unsigned-IPA
          path: build/ProCamera.ipa
          retention-days: 14
